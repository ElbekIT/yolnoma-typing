<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="300" height="300" fill="#05070d" rx="40" />

  <!-- Outer Triangle -->
  <polygon points="35,60 265,60 150,260" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Inner Y Shape -->
  <g fill="url(#goldGlow)">
    <!-- Left arm of Y -->
    <polygon points="75,85 110,85 150,155 130,180" />
    <!-- Right arm of Y -->
    <polygon points="225,85 190,85 130,180 150,180" />
    <!-- Stem of Y -->
    <polygon points="135,170 165,170 150,230" />
  </g>
</svg>
