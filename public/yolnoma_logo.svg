<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <defs>
    <!-- Left Ribbon Gradient (Bright Cyan-Blue) -->
    <linearGradient id="yGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Right Ribbon Gradient (Dark Navy Blue) -->
    <linearGradient id="yGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0044AA" />
    </linearGradient>
  </defs>

  <!-- Y STYLIZED ICON -->
  <g transform="translate(10, 10)">
    <!-- Right Dark Arm of Y -->
    <path d="M 40 10 L 85 55 C 92 62 90 74 80 82 L 48 102 C 40 107 30 103 28 94 L 20 60 L 40 10 Z" fill="url(#yGradRight)" />

    <!-- Left Bright Ribbon Arm of Y -->
    <path d="M 12 18 C 10 10 18 2 28 8 L 60 32 C 68 38 68 50 60 56 L 28 88 C 22 94 12 90 10 82 L 12 18 Z" fill="url(#yGradLeft)" />

    <!-- Overlapping Smooth Curve -->
    <path d="M 32 40 C 44 28 62 40 50 56 C 40 68 22 80 14 62 Z" fill="#0088FF" opacity="0.8" />
  </g>

  <!-- BRAND TEXT: Yolnoma -->
  <text x="115" y="70" font-family="'Plus Jakarta Sans', 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="62" fill="currentColor" letter-spacing="-1.5">Yolnoma</text>

  <!-- BRAND SUBTITLE: TYPING -->
  <text x="235" y="100" font-family="'Plus Jakarta Sans', 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="18" fill="#0088FF" letter-spacing="9">TYPING</text>
</svg>
