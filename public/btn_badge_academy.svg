<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="capGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#facc15" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#capGlow)">
    <!-- Golden Wreath / Laurels -->
    <path d="M12 36 C10 24 16 16 22 12" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M52 36 C54 24 48 16 42 12" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Keycap Pedestal Below -->
    <rect x="20" y="44" width="24" height="12" rx="3" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.6"/>
    <line x1="24" y1="48" x2="40" y2="48" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="26" y1="52" x2="38" y2="52" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Mortarboard Skullcap -->
    <path d="M22 26 L22 35 C22 41 42 41 42 35 L42 26 Z" fill="url(#capGrad)"/>
    <ellipse cx="32" cy="35" rx="10" ry="2" fill="#1e1b4b" opacity="0.4"/>

    <!-- Mortarboard Diamond Top -->
    <polygon points="32,14 54,23 32,32 10,23" fill="url(#capGrad)" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Button & Golden Tassel -->
    <circle cx="32" cy="23" r="2.5" fill="url(#goldGrad)"/>
    <path d="M32 23 Q44 26 46 36 L48 40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="46,39 50,40 48,46" fill="url(#goldGrad)"/>

    <!-- Shiny Star -->
    <polygon points="32,6 34,10 38,11 35,14 36,18 32,16 28,18 29,14 26,11 30,10" fill="url(#goldGrad)"/>
  </g>
</svg>
