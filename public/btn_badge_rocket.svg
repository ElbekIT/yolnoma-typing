<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="rocketFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="rocketWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="rocketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#rocketGlow)">
    <!-- Exhaust Flame -->
    <path d="M22 42 Q14 48 10 56 Q20 54 26 46 Z" fill="url(#rocketFlame)"/>
    <path d="M20 44 Q16 48 13 53 Q19 51 23 47 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Left Fin -->
    <path d="M26 34 L16 38 Q18 48 28 46 L28 36 Z" fill="url(#rocketWing)"/>
    <!-- Right Fin -->
    <path d="M38 22 L42 12 Q52 14 50 24 L40 24 Z" fill="url(#rocketWing)"/>

    <!-- Main Rocket Fuselage -->
    <path d="M22 42 Q32 32 46 16 Q54 8 56 6 Q54 14 46 22 Q32 36 22 42 Z" fill="url(#rocketBody)"/>
    <path d="M46 16 Q54 8 56 6 Q54 14 46 22 Z" fill="url(#rocketWing)"/>

    <!-- Porthole Window -->
    <circle cx="36" cy="24" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="34" cy="22" r="1.8" fill="#ffffff"/>

    <!-- Speed Sparks -->
    <circle cx="12" cy="38" r="1.5" fill="#facc15"/>
    <circle cx="28" cy="56" r="1.5" fill="#facc15"/>
    <circle cx="8" cy="50" r="1.2" fill="#fb923c"/>
  </g>
</svg>
