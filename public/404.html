<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yolnoma Typing</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #e2b714;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(226, 183, 20, 0.2);
        border-radius: 50%;
        border-top-color: #e2b714;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.15rem;
        margin: 0 0 6px 0;
        color: #ffffff;
      }
      p {
        font-size: 0.825rem;
        color: #646669;
        margin: 0;
      }
    </style>
    <script>
      (function () {
        // Har qanday noto'g'ri yoki adashgan yo'l kelganda, darhol toza bosh manzilga qaytarish
        try {
          var pathname = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
          if (pathname && pathname !== 'index.html' && pathname !== '404' && pathname !== '404.html') {
            sessionStorage.setItem('yolnoma_target_tab', pathname);
          }
        } catch (e) {}
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Yolnoma Typing</h2>
    <p>Bosh sahifaga yo'naltirilmoqda...</p>
  </body>
</html>
