<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yolnoma Typing - Sahifa Qayta Yo'naltirilmoqda...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #e2b714;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(226, 183, 20, 0.2);
        border-radius: 50%;
        border-top-color: #e2b714;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.25rem;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 0.875rem;
        color: #646669;
        margin: 0;
      }
    </style>
    <script>
      // Single Page App redirect for static hosts / CDNs
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Save targeted path for SPA router
        sessionStorage.setItem('yolnoma_redirect_path', pathname + search + hash);

        // Instant redirect back to index.html with preserved route
        window.location.replace('/' + (pathname && pathname !== '/' ? '?route=' + encodeURIComponent(pathname.replace(/^\/+/, '')) : '') + hash);
      })();
    </script>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Yolnoma Typing</h2>
    <p>Sahifaga ulanmoqda, iltimos kuting...</p>
  </body>
</html>
